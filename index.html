<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>PIE HALL 98</title>
    <meta
      name="description"
      content="A short browser school-hall shooter rendered with a 2D raycasting engine — fight through waves, pick two upgrades, and clear the exit in under five minutes."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="sr-only">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>

    <main id="game-root">
      <h1 class="sr-only">PIE HALL 98</h1>

      <div id="game-stage">
        <canvas id="game-canvas" width="320" height="200" aria-hidden="true"></canvas>

        <div id="hud" aria-hidden="true">
          <div class="hud-item">
            <svg viewBox="0 0 24 24" class="hud-icon"><path fill="currentColor" d="M12 21s-7.5-4.7-10-9.3C.4 8.4 2 5 5.4 5 7.6 5 9.4 6.1 12 8.7 14.6 6.1 16.4 5 18.6 5 22 5 23.6 8.4 22 11.7 19.5 16.3 12 21 12 21z"/></svg>
            <span id="hud-health-value">100</span>
          </div>
          <div class="hud-item">
            <svg viewBox="0 0 24 24" class="hud-icon"><ellipse cx="12" cy="12" rx="9" ry="9" fill="currentColor"/><ellipse cx="12" cy="12" rx="9" ry="3.5" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5"/></svg>
            <span id="hud-ammo-value">16</span>
          </div>
          <div class="hud-item">
            <svg viewBox="0 0 24 24" class="hud-icon"><circle cx="12" cy="8" r="4" fill="currentColor"/><path fill="currentColor" d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>
            <span id="hud-enemies-value">1</span>
          </div>
          <div class="hud-item">
            <svg viewBox="0 0 24 24" class="hud-icon"><path fill="currentColor" d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.4 5.7 20.8 8 13.6 2 9.2h7.6z"/></svg>
            <span id="hud-score-value">0</span>
          </div>
          <div class="hud-item">
            <span id="hud-multiplier-value">x1</span>
          </div>
          <div class="hud-item">
            <span id="hud-timer-value">0:00</span>
          </div>
        </div>

        <div id="hint-banner" aria-hidden="true" hidden></div>
      </div>

      <div id="touch-controls" aria-hidden="true">
        <div class="touch-cluster touch-move">
          <button id="btn-turn-left" class="touch-btn" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15 4l-8 8 8 8z"/></svg>
          </button>
          <button id="btn-forward" class="touch-btn" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 4l8 10H4z"/></svg>
          </button>
          <button id="btn-turn-right" class="touch-btn" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 4l8 8-8 8z"/></svg>
          </button>
          <button id="btn-backward" class="touch-btn" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 20l8-10H4z"/></svg>
          </button>
        </div>
        <button id="btn-fire" class="touch-btn touch-fire" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
        </button>
      </div>

      <div id="end-overlay" hidden>
        <div id="end-panel">
          <h2 id="end-title">Cleared!</h2>
          <dl id="end-stats">
            <div><dt>Time</dt><dd id="end-time-value">0:00</dd></div>
            <div><dt>Score</dt><dd id="end-score-value">0</dd></div>
            <div><dt>Kills</dt><dd id="end-kills-value">0</dd></div>
            <div><dt>Best combo</dt><dd id="end-combo-value">x1</dd></div>
            <div><dt>Upgrades</dt><dd id="end-upgrades-value">None</dd></div>
            <div><dt>Grade</dt><dd id="end-grade-value">-</dd></div>
          </dl>
          <button id="btn-retry" class="retry-btn" type="button">
            <svg viewBox="0 0 24 24">
              <path fill="currentColor" d="M12 4V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
